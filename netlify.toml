# Netlify Configuration File
# This file configures build settings for Netlify deployment

[build]
  # Build command for Next.js static export
  command = "npm run build"
  
  # Output directory (Next.js static export outputs to 'out' directory)
  publish = "out"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"

# Shopify mandatory GDPR compliance webhooks → Netlify Functions
# De algemene voorwaarden staan op de offertes, niet meer op de site (23/09/2026).
# Sinds 26/11 staan de gratis prompts op een eigen pagina (Amina en Alex): oude links gaan daarheen.
# force: de oude pagina bestaat nog in de export (als vangnet stuurt ze zelf ook door).
[[redirects]]
  from = "/hub/resources/*"
  to = "/gratis-materiaal/"
  status = 301
  force = true

[[redirects]]
  from = "/algemene-voorwaarden/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/portal/webhooks/customers/data_request"
  to = "/.netlify/functions/shopify-webhook-customers-data-request"
  status = 200
  force = true

[[redirects]]
  from = "/portal/webhooks/customers/redact"
  to = "/.netlify/functions/shopify-webhook-customers-redact"
  status = 200
  force = true

[[redirects]]
  from = "/portal/webhooks/shop/redact"
  to = "/.netlify/functions/shopify-webhook-shop-redact"
  status = 200
  force = true

# Finit OS interactive intake — chat is a Netlify Edge Function (Deno),
# the rest are regular Netlify Functions (Node). Edge avoids AWS Lambda
# Streaming's framing 502s; see netlify/edge-functions/intake-chat.ts.
[[edge_functions]]
  path = "/api/intake/chat"
  function = "intake-chat"

[[redirects]]
  from = "/api/intake/state"
  to = "/.netlify/functions/intake-state"
  status = 200
  force = true

[[redirects]]
  from = "/api/intake/transcribe"
  to = "/.netlify/functions/intake-transcribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/intake/submit"
  to = "/.netlify/functions/intake-submit"
  status = 200
  force = true

# Het contactformulier van de site. Verving de n8n-webhook die stilviel.
[[redirects]]
  from = "/api/contact-submit"
  to = "/.netlify/functions/contact-submit"
  status = 200
  force = true

# Het formulier op /cursus/: lead in Tuesday (Socials, groep Cursus (Skool)) en mail naar contact@.
[[redirects]]
  from = "/api/cursus-aanvraag"
  to = "/.netlify/functions/cursus-aanvraag"
  status = 200
  force = true

# Het sollicitatieformulier op /vacatures: zelfde mailpad als het contactformulier.
[[redirects]]
  from = "/api/sollicitatie-submit"
  to = "/.netlify/functions/sollicitatie-submit"
  status = 200
  force = true

# Het e-mailslot op de resources van de hub: bewaart het adres in Brevo.
[[redirects]]
  from = "/api/hub-toegang"
  to = "/.netlify/functions/hub-toegang"
  status = 200
  force = true

[[redirects]]
  from = "/api/vsl-bron"
  to = "/.netlify/functions/vsl-bron"
  status = 200
  force = true

# Anonieme kijkmeting van de VSL op de hub, en de cijfers voor /hub/cijfers/.
[[redirects]]
  from = "/api/vsl-meting"
  to = "/.netlify/functions/vsl-meting"
  status = 200
  force = true

[[redirects]]
  from = "/api/vsl-cijfers"
  to = "/.netlify/functions/vsl-cijfers"
  status = 200
  force = true

# Gesloten sinds 25/11/2026: de intake (lead-magnet en /api/intake/*) geeft 410 zolang
# INTAKE_OPEN niet op 1 staat in Netlify. Geen pagina gebruikt ze nog.
[[redirects]]
  from = "/api/lead-magnet/start"
  to = "/.netlify/functions/lead-magnet-start"
  status = 200
  force = true

# De pagina's per case (/cases/<slug>) bestaan niet meer sinds de review van
# 13 september 2026: alle oplossingen staan uitgeschreven op /cases.
[[redirects]]
  from = "/cases/:slug"
  to = "/cases/"
  status = 301

# Redirect rules for Next.js App Router with trailing slashes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Note: Environment variables should be set in Netlify Dashboard
# Go to: Site settings → Environment variables
# Do NOT put sensitive values in this file if it's committed to version control
